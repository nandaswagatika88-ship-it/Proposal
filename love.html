<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#ffb6d9,#fff5fa);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
overflow:hidden;
}

.card{
background:white;
width:90%;
max-width:420px;
padding:20px;
border-radius:25px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.25);
animation:pop 1s ease;
}

@keyframes pop{
from{
transform:scale(.5);
opacity:0;
}
to{
transform:scale(1);
opacity:1;
}
}

img{
width:100%;
border-radius:20px;
margin-bottom:20px;
box-shadow:0 8px 20px rgba(0,0,0,.2);
}

h1{
color:#ff2d75;
font-size:32px;
margin-bottom:15px;
}

p{
font-size:18px;
line-height:1.8;
color:#555;
}

</style>

</head>
