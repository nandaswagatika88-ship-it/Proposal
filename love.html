<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love You ❤️</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#ffb6d9,#ffeaf4);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
overflow:hidden;
}

.card{
background:#fff;
padding:20px;
border-radius:20px;
width:90%;
max-width:400px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.25);
}

img{
width:100%;
border-radius:15px;
margin-bottom:20px;
}

h1{
color:#ff2d75;
}

p{
font-size:18px;
line-height:1.8;
}

button{
padding:15px 35px;
background:#ff2d75;
color:#fff;
border:none;
border-radius:50px;
font-size:18px;
cursor:pointer;
margin-top:15px;
}

.heart{
position:fixed;
font-size:24px;
animation:fall 5s linear infinite;
}

@keyframes fall{
0%{transform:translateY(-100px);}
100%{transform:translateY(110vh);}
}
</style>
</head>

<body>

<div class="card">

<img src="love.jpg">

<h1>YAYYYYY!! ❤️🥹</h1>

<p>
I LOVE YOU SOOO MUCHHH KIDDOOO!! 🥹❤️🫶
<br><br>
You just made me the happiest person alive. 💖
<br><br>
Thank you for saying YES.
<br><br>
I promise to always care for you, support you and make you smile.
<br><br>
❤️ Forever Starts Today ❤️
</p>

</div>

<script>
setInterval(()=>{
const h=document.createElement("div");
h.className="heart";
h.innerHTML="❤️";
h.style.left=Math.random()*100+"vw";
document.body.appendChild(h);
setTimeout(()=>h.remove(),5000);
},250);
</script>

</body>
</html>
