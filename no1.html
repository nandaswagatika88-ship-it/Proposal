<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Please Think Again ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

background:linear-gradient(135deg,#ffd6e8,#fff5fa);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;

}

.card{

background:white;
width:90%;
max-width:420px;
padding:25px;
border-radius:25px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.2);

}

img{

width:220px;
height:220px;
border-radius:20px;
object-fit:cover;
margin-bottom:20px;
box-shadow:0 8px 20px rgba(0,0,0,.2);

}

h1{

color:#ff2d75;
margin-bottom:15px;

}

p{

font-size:17px;
line-height:1.8;
color:#555;
margin-bottom:25px;

}

.buttons{

display:flex;
justify-content:center;
gap:18px;

}

button{

padding:13px 28px;
border:none;
border-radius:40px;
font-size:17px;
cursor:pointer;
transition:.3s;

}

.yes{

background:#ff2d75;
color:white;

}

.no{

background:#555;
color:white;

}

button:hover{

transform:scale(1.08);

}

.heart{

position:absolute;
font-size:22px;
animation:fall linear infinite;

}

@keyframes fall{

0%{

transform:translateY(-100px);

}

100%{

transform:translateY(120vh);

}

}

</style>

</head>

<body>

<div class="card">

<img src="images/boy.jpg">

<h1>No Huh??? 🥺</h1>

<p>

You Cannot See My Love For You In My Eyess?? 🥹❤️

<br><br>

See Those Puppy Eyes... 🐶🥺

<br><br>

Pleasee... One More Chance? ❤️

</p>

<div class="buttons">

<button class="yes"
onclick="location.href='love.html'">

Now Yes ❤️

</button>

<button class="no"
onclick="location.href='no2.html'">

Still No 😔

</button>

</div>

</div>

<script>

function heart(){

const h=document.createElement("div");

h.className="heart";

h.innerHTML="❤️";

h.style.left=Math.random()*100+"vw";

h.style.animationDuration=(Math.random()*3+3)+"s";

document.body.appendChild(h);

setTimeout(()=>{

h.remove();

},6000);

}

setInterval(heart,300);

</script>

</body>
</html>
