<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Kiddo ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:linear-gradient(135deg,#ffd6e8,#ffeef6);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
overflow-x:hidden;
}

.container{
max-width:420px;
width:100%;
background:white;
padding:20px;
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,.2);
text-align:center;
}

h1{
color:#ff2d75;
margin-bottom:15px;
}

.gallery{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:20px;
}

.gallery img{
width:100%;
height:180px;
object-fit:cover;
border-radius:15px;
transition:.4s;
}

.gallery img:hover{
transform:scale(1.05);
}

p{
font-size:15px;
line-height:1.7;
color:#555;
margin-bottom:20px;
}

button{
padding:14px 35px;
border:none;
border-radius:50px;
background:#ff2d75;
color:white;
font-size:18px;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.08);
}

.heart{
position:fixed;
font-size:20px;
animation:fall linear infinite;
color:#ff2d75;
}

@keyframes fall{
0%{
transform:translateY(-100px);
}
100%{
transform:translateY(120vh);
}
}

</style>

</head>

<body>

<div class="container">

<h1>Hey Kiddo ❤️</h1>

<div class="gallery">

<img src="photo1.jpg">
<img src="photo2.jpg">
<img src="photo3.jpg">
<img src="photo4.jpg">

</div>

<p>

Every moment I spend thinking about you becomes one of my favourite memories. ❤️

Your smile makes everything around me brighter.

No matter what happens, you'll always be someone incredibly special to me.

Today I just want to ask something that has been in my heart for a long time...🥺💖

</p>

<a href="question.html">
<button>Continue ❤️</button>
</a>

</div>

<script>

function heart(){

const h=document.createElement("div");

h.className="heart";

h.innerHTML="❤️";

h.style.left=Math.random()*100+"vw";

h.style.animationDuration=(Math.random()*3+3)+"s";

document.body.appendChild(h);

setTimeout(()=>{

h.remove();

},6000);

}

setInterval(heart,300);

</script>

</body>
</html>
