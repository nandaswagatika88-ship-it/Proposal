<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>One Question ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{

height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ffd6e8,#fff5fa);
overflow:hidden;

}

.card{

width:90%;
max-width:400px;
background:white;
padding:30px;
border-radius:25px;
text-align:center;
box-shadow:0 10px 25px rgba(0,0,0,.2);

}

h1{

color:#ff2d75;
font-size:32px;
margin-bottom:20px;

}

p{

font-size:20px;
margin-bottom:30px;
color:#555;

}

.buttons{

display:flex;
justify-content:center;
gap:20px;

}

button{

padding:14px 35px;
border:none;
border-radius:50px;
font-size:18px;
cursor:pointer;
transition:.3s;

}

.yes{

background:#ff2d75;
color:white;

}

.no{

background:#555;
color:white;

}

button:hover{

transform:scale(1.1);

}

.heart{

position:absolute;
font-size:22px;
animation:fall linear infinite;

}

@keyframes fall{

0%{

transform:translateY(-100px);

}

100%{

transform:translateY(120vh);

}

}

</style>

</head>

<body>

<div class="card">

<h1>🥺❤️</h1>

<p>

Will You Be Mine Forever?

</p>

<div class="buttons">

<button class="yes" onclick="location.href='love.html'">

YES ❤️

</button>

<button class="no" onclick="location.href='no1.html'">

NO 😔

</button>

</div>

</div>

<script>

function createHeart(){

const heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

heart.style.animationDuration=(Math.random()*3+3)+"s";

document.body.appendChild(heart);

setTimeout(()=>heart.remove(),6000);

}

setInterval(createHeart,300);

</script>

</body>
</html>
